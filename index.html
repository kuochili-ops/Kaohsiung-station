    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // ==========================================
        // 1. 全域變數與狀態
        // ==========================================
        let scene, camera, renderer, controls;
        let ornamentGroup, stationGroup, pedestalGroup, clockGroup;
        let signMeshes = [], windowMaterials = [];
        let dirLight, hemiLight, ambientLight, porticoLights = [], showcaseLight;
        let isAutoRotating = false;

        let targetCamPos = null;
        let targetLookAt = null;

        // 翻板時鐘狀態
        const flipUnits = {};
        const textureCache = {};
        let customTextColor = '#f8fafc';
        let customCardBgColor = '#1e293b';
        let soundEnabled = true;
        let audioCtx = null;

        function showToast(text, isError = false) {
            const toast = document.getElementById('toast-msg');
            toast.textContent = text;
            toast.className = `glass-panel rounded-full px-4 py-2 text-xs font-semibold shadow-lg transition-all duration-300 ${
                isError ? 'text-red-600' : 'text-emerald-700'
            }`;
            toast.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3500);
        }

        // ==========================================
        // 2. 雙脈衝機械翻頁音效 (Web Audio API)
        // ==========================================
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playFlipSound() {
            if (!soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(340, now);
            osc1.frequency.exponentialRampToValueAtTime(95, now + 0.03);
            gain1.gain.setValueAtTime(0.08, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.03);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(185, now + 0.21);
            osc2.frequency.exponentialRampToValueAtTime(42, now + 0.29);
            gain2.gain.setValueAtTime(0.22, now + 0.21);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.29);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.21);
            osc2.stop(now + 0.29);
        }

        // ==========================================
        // 3. Canvas 2D 程序化高解析紋理生成 (第一版建築 + 胡桃木基座 + 翻板字卡)
        // ==========================================
        function createRoofTileTextures() {
            const width = 512, height = 512;
            const colorCanvas = document.createElement('canvas');
            colorCanvas.width = width;
            colorCanvas.height = height;
            const ctx = colorCanvas.getContext('2d');

            const bumpCanvas = document.createElement('canvas');
            bumpCanvas.width = width;
            bumpCanvas.height = height;
            const bCtx = bumpCanvas.getContext('2d');

            ctx.fillStyle = '#383b40';
            ctx.fillRect(0, 0, width, height);
            bCtx.fillStyle = '#606060';
            bCtx.fillRect(0, 0, width, height);

            const cols = 16;
            const rows = 16;
            const colW = width / cols;
            const rowH = height / rows;

            for (let r = 0; r < rows; r++) {
                const y = r * rowH;
                const grad = ctx.createLinearGradient(0, y, 0, y + rowH);
                grad.addColorStop(0, 'rgba(20, 22, 25, 0.75)');
                grad.addColorStop(0.2, 'rgba(65, 69, 75, 0.25)');
                grad.addColorStop(0.85, 'rgba(50, 53, 58, 0.1)');
                grad.addColorStop(1, 'rgba(15, 17, 20, 0.85)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, y, width, rowH);

                const bGrad = bCtx.createLinearGradient(0, y, 0, y + rowH);
                bGrad.addColorStop(0, '#202020');
                bGrad.addColorStop(0.25, '#c8c8c8');
                bGrad.addColorStop(0.9, '#888888');
                bGrad.addColorStop(1, '#181818');
                bCtx.fillStyle = bGrad;
                bCtx.fillRect(0, y, width, rowH);
            }

            for (let c = 0; c < cols; c++) {
                const x = c * colW;
                const cGrad = ctx.createLinearGradient(x, 0, x + colW, 0);
                cGrad.addColorStop(0, 'rgba(15, 16, 18, 0.65)');
                cGrad.addColorStop(0.45, 'rgba(85, 90, 98, 0.35)');
                cGrad.addColorStop(0.55, 'rgba(85, 90, 98, 0.35)');
                cGrad.addColorStop(1, 'rgba(15, 16, 18, 0.65)');
                ctx.fillStyle = cGrad;
                ctx.fillRect(x, 0, colW, height);

                const bcGrad = bCtx.createLinearGradient(x, 0, x + colW, 0);
                bcGrad.addColorStop(0, '#222222');
                bcGrad.addColorStop(0.5, '#ffffff');
                bcGrad.addColorStop(1, '#222222');
                bCtx.globalAlpha = 0.55;
                bCtx.fillStyle = bcGrad;
                bCtx.fillRect(x, 0, colW, height);
                bCtx.globalAlpha = 1.0;
            }

            for (let i = 0; i < 4000; i++) {
                const nx = Math.random() * width;
                const ny = Math.random() * height;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)';
                ctx.fillRect(nx, ny, 2, 2);
            }

            const map = new THREE.CanvasTexture(colorCanvas);
            map.wrapS = map.wrapT = THREE.RepeatWrapping;
            map.repeat.set(4, 3);
            map.colorSpace = THREE.SRGBColorSpace;

            const bumpMap = new THREE.CanvasTexture(bumpCanvas);
            bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
            bumpMap.repeat.set(4, 3);

            return { map, bumpMap };
        }

        function createSignboardTexture(char) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 384;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#c5c9d1';
            ctx.fillRect(0, 0, 256, 384);

            ctx.fillStyle = '#243665';
            ctx.fillRect(14, 14, 228, 300);

            ctx.fillStyle = '#f4f5f7';
            ctx.fillRect(14, 314, 228, 22);
            ctx.fillStyle = '#b93838';
            ctx.fillRect(14, 336, 228, 34);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 4;
            ctx.strokeRect(22, 22, 212, 284);

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 165px "Noto Sans TC", "Microsoft JhengHei", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;
            ctx.fillText(char, 128, 168);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 8;
            return tex;
        }

        function createWindowTexture(cols = 2, rows = 4, isArched = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const glassGrad = ctx.createLinearGradient(0, 0, 256, 512);
            glassGrad.addColorStop(0, '#2a3442');
            glassGrad.addColorStop(0.5, '#3b4859');
            glassGrad.addColorStop(1, '#1e2631');
            ctx.fillStyle = glassGrad;
            ctx.fillRect(0, 0, 256, 512);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.beginPath();
            ctx.moveTo(0, 120);
            ctx.lineTo(256, 40);
            ctx.lineTo(256, 110);
            ctx.lineTo(0, 190);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#3d332a';
            ctx.lineWidth = 18;
            ctx.strokeRect(9, 9, 238, 494);

            ctx.lineWidth = 8;
            const cellW = 238 / cols;
            const cellH = 494 / rows;

            for (let c = 1; c < cols; c++) {
                ctx.beginPath();
                ctx.moveTo(9 + c * cellW, 9);
                ctx.lineTo(9 + c * cellW, 503);
                ctx.stroke();
            }
            for (let r = 1; r < rows; r++) {
                ctx.beginPath();
                ctx.moveTo(9, 9 + r * cellH);
                ctx.lineTo(247, 9 + r * cellH);
                ctx.stroke();
            }

            if (isArched) {
                ctx.beginPath();
                ctx.arc(128, 128, 110, Math.PI, 0);
                ctx.lineWidth = 10;
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createStuccoTexture(baseHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseHex;
            ctx.fillRect(0, 0, 256, 256);

            for (let i = 0; i < 3500; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.04)';
                ctx.fillRect(x, y, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(3, 2);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createWalnutWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#3c2415';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 160; i++) {
                ctx.fillStyle = i % 2 === 0 ? 'rgba(22, 11, 4, 0.32)' : 'rgba(92, 58, 35, 0.24)';
                ctx.fillRect(0, i * 3.2, 512, 1.5 + Math.random() * 2.2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createPlaqueTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 110;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1b150f';
            ctx.fillRect(0, 0, 640, 110);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 7;
            ctx.strokeRect(7, 7, 626, 96);

            ctx.fillStyle = '#f5d47a';
            ctx.font = 'bold 40px "Noto Sans TC", "Microsoft JhengHei", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('高雄驛 · CHRONOFLIP 1941', 320, 56);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // ==========================================
        // 4. 帝冠式屋頂與建築構件幾何生成器 (100% 保留第一版)
        // ==========================================
        function createCurvedHippedRoofGeometry(bottomW, bottomD, topW, topD, height, curveSag = 0.35) {
            const segs = 16;
            const geo = new THREE.BufferGeometry();
            const positions = [];
            const uvs = [];
            const indices = [];

            for (let i = 0; i <= segs; i++) {
                const t = i / segs;
                const w = THREE.MathUtils.lerp(bottomW, topW, t);
                const d = THREE.MathUtils.lerp(bottomD, topD, t);

                const curvedT = Math.pow(t, 1.38);
                const y = curvedT * height;

                const hw = w * 0.5;
                const hd = d * 0.5;

                const corners = [
                    [-hw, y,  hd],
                    [ hw, y,  hd],
                    [ hw, y, -hd],
                    [-hw, y, -hd]
                ];

                const cornerLift = (1 - t) * (1 - t) * (height * 0.085);

                for (let c = 0; c < 4; c++) {
                    positions.push(corners[c][0], corners[c][1] + cornerLift, corners[c][2]);
                    uvs.push(c % 2 === 0 ? 0 : 1, t);
                }
            }

            for (let i = 0; i < segs; i++) {
                const rowA = i * 4;
                const rowB = (i + 1) * 4;
                for (let side = 0; side < 4; side++) {
                    const nextSide = (side + 1) % 4;
                    const a0 = rowA + side;
                    const a1 = rowA + nextSide;
                    const b0 = rowB + side;
                    const b1 = rowB + nextSide;

                    indices.push(a0, a1, b1);
                    indices.push(a0, b1, b0);
                }
            }

            if (topW > 0.01 && topD > 0.01) {
                const topRow = segs * 4;
                indices.push(topRow + 0, topRow + 1, topRow + 2);
                indices.push(topRow + 0, topRow + 2, topRow + 3);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        function buildKarahafuGable(roofMat, trimMat, wallMat, goldAccentMat) {
            const group = new THREE.Group();

            const span = 3.6;
            const peakH = 2.05;
            const depth = 2.6;

            const shape = new THREE.Shape();
            shape.moveTo(-span, 0);
            shape.bezierCurveTo(-span * 0.65, 0.05, -span * 0.42, peakH * 0.92, 0, peakH);
            shape.bezierCurveTo(span * 0.42, peakH * 0.92, span * 0.65, 0.05, span, 0);
            shape.lineTo(span * 0.86, -0.18);
            shape.bezierCurveTo(span * 0.45, -0.1, span * 0.35, peakH * 0.66, 0, peakH * 0.72);
            shape.bezierCurveTo(-span * 0.35, peakH * 0.66, -span * 0.45, -0.1, -span * 0.86, -0.18);
            shape.closePath();

            const bargeGeo = new THREE.ExtrudeGeometry(shape, {
                depth: depth,
                bevelEnabled: true,
                bevelThickness: 0.08,
                bevelSize: 0.06,
                bevelSegments: 3
            });
            const bargeMesh = new THREE.Mesh(bargeGeo, trimMat);
            bargeMesh.position.z = -depth * 0.5;
            bargeMesh.castShadow = true;
            bargeMesh.receiveShadow = true;
            group.add(bargeMesh);

            const roofShape = new THREE.Shape();
            const rSpan = span + 0.25;
            const rPeak = peakH + 0.28;
            roofShape.moveTo(-rSpan, 0.05);
            roofShape.bezierCurveTo(-rSpan * 0.65, 0.12, -rSpan * 0.42, rPeak * 0.92, 0, rPeak);
            roofShape.bezierCurveTo(rSpan * 0.42, rPeak * 0.92, rSpan * 0.65, 0.12, rSpan, 0.05);
            roofShape.lineTo(span, -0.02);
            roofShape.bezierCurveTo(span * 0.65, 0.04, span * 0.42, peakH * 0.92, 0, peakH);
            roofShape.bezierCurveTo(-span * 0.42, peakH * 0.92, -span * 0.65, 0.04, -span, -0.02);
            roofShape.closePath();

            const roofGeo = new THREE.ExtrudeGeometry(roofShape, {
                depth: depth + 0.35,
                bevelEnabled: false
            });
            const roofMesh = new THREE.Mesh(roofGeo, roofMat);
            roofMesh.position.z = -(depth + 0.35) * 0.5 + 0.12;
            roofMesh.castShadow = true;
            roofMesh.receiveShadow = true;
            group.add(roofMesh);

            const innerWallShape = new THREE.Shape();
            innerWallShape.moveTo(-span * 0.85, -0.15);
            innerWallShape.bezierCurveTo(-span * 0.45, -0.08, -span * 0.35, peakH * 0.66, 0, peakH * 0.72);
            innerWallShape.bezierCurveTo(span * 0.35, peakH * 0.66, span * 0.45, -0.08, span * 0.85, -0.15);
            innerWallShape.lineTo(span * 0.85, -0.35);
            innerWallShape.lineTo(-span * 0.85, -0.35);
            innerWallShape.closePath();

            const innerGeo = new THREE.ExtrudeGeometry(innerWallShape, { depth: depth - 0.25, bevelEnabled: false });
            const innerMesh = new THREE.Mesh(innerGeo, wallMat);
            innerMesh.position.z = -(depth - 0.25) * 0.5;
            group.add(innerMesh);

            const medallionGeo = new THREE.CylinderGeometry(0.45, 0.5, 0.2, 24);
            medallionGeo.rotateX(Math.PI / 2);
            const medallion = new THREE.Mesh(medallionGeo, goldAccentMat);
            medallion.position.set(0, peakH * 0.36, depth * 0.5 + 0.05);
            group.add(medallion);

            const ridgeGeo = new THREE.BoxGeometry(0.28, 0.32, depth + 0.45);
            const ridgeMesh = new THREE.Mesh(ridgeGeo, roofMat);
            ridgeMesh.position.set(0, rPeak + 0.08, 0.12);
            ridgeMesh.castShadow = true;
            group.add(ridgeMesh);

            const oniGeo = new THREE.CylinderGeometry(0.14, 0.24, 0.42, 8);
            const oniMesh = new THREE.Mesh(oniGeo, roofMat);
            oniMesh.position.set(0, rPeak + 0.28, depth * 0.5 + 0.22);
            group.add(oniMesh);

            return group;
        }

        // ==========================================
        // 6. 翻板時鐘貼圖與四層防穿模翻轉機構
        // ==========================================
        function darkenHexColor(hex, factor = 0.5) {
            const clean = hex.replace('#', '');
            const r = Math.floor(parseInt(clean.substring(0, 2), 16) * factor);
            const g = Math.floor(parseInt(clean.substring(2, 4), 16) * factor);
            const b = Math.floor(parseInt(clean.substring(4, 6), 16) * factor);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function getHalfTextures(digit) {
            const cacheKey = `${customCardBgColor}_${customTextColor}_${digit}`;
            if (textureCache[cacheKey]) return textureCache[cacheKey];

            const borderColor = darkenHexColor(customCardBgColor, 0.5);
            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = 256;
            fullCanvas.height = 512;
            const fCtx = fullCanvas.getContext('2d');

            fCtx.fillStyle = '#070a10';
            fCtx.fillRect(0, 0, 256, 512);

            fCtx.save();
            roundRect(fCtx, 6, 6, 244, 244, 18);
            fCtx.fillStyle = customCardBgColor;
            fCtx.fill();
            fCtx.lineWidth = 3;
            fCtx.strokeStyle = borderColor;
            fCtx.stroke();
            fCtx.restore();

            fCtx.save();
            roundRect(fCtx, 6, 262, 244, 244, 18);
            fCtx.fillStyle = customCardBgColor;
            fCtx.fill();
            fCtx.lineWidth = 3;
            fCtx.strokeStyle = borderColor;
            fCtx.stroke();
            fCtx.restore();

            fCtx.save();
            fCtx.translate(128, 260);
            fCtx.scale(0.84, 1.38);
            fCtx.fillStyle = customTextColor;
            fCtx.font = 'bold 310px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            fCtx.textAlign = 'center';
            fCtx.textBaseline = 'middle';
            fCtx.fillText(digit, 0, 8);
            fCtx.restore();

            fCtx.fillStyle = '#05070c';
            fCtx.fillRect(0, 250, 256, 12);
            fCtx.fillStyle = 'rgba(255, 255, 255, 0.14)';
            fCtx.fillRect(6, 262, 244, 3);

            const topCanvas = document.createElement('canvas');
            topCanvas.width = 256;
            topCanvas.height = 256;
            topCanvas.getContext('2d').drawImage(fullCanvas, 0, 0, 256, 256, 0, 0, 256, 256);

            const bottomCanvas = document.createElement('canvas');
            bottomCanvas.width = 256;
            bottomCanvas.height = 256;
            bottomCanvas.getContext('2d').drawImage(fullCanvas, 0, 256, 256, 256, 0, 0, 256, 256);

            const bottomFlippedCanvas = document.createElement('canvas');
            bottomFlippedCanvas.width = 256;
            bottomFlippedCanvas.height = 256;
            const bfCtx = bottomFlippedCanvas.getContext('2d');
            bfCtx.translate(128, 128);
            bfCtx.rotate(Math.PI);
            bfCtx.drawImage(bottomCanvas, -128, -128);

            const topTex = new THREE.CanvasTexture(topCanvas);
            const bottomTex = new THREE.CanvasTexture(bottomCanvas);
            const bottomFlippedTex = new THREE.CanvasTexture(bottomFlippedCanvas);
            topTex.colorSpace = THREE.SRGBColorSpace;
            bottomTex.colorSpace = THREE.SRGBColorSpace;
            bottomFlippedTex.colorSpace = THREE.SRGBColorSpace;

            textureCache[cacheKey] = { top: topTex, bottom: bottomTex, bottomFlipped: bottomFlippedTex };
            return textureCache[cacheKey];
        }

        function createFlipUnit(cardW = 2.05, halfH = 1.98) {
            const group = new THREE.Group();

            const topStatic = new THREE.Mesh(
                new THREE.PlaneGeometry(cardW, halfH),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            topStatic.position.set(0, halfH / 2, 0.02);

            const bottomStatic = new THREE.Mesh(
                new THREE.PlaneGeometry(cardW, halfH),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            bottomStatic.position.set(0, -halfH / 2, 0.02);

            const bottomShadow = new THREE.Mesh(
                new THREE.PlaneGeometry(cardW, halfH),
                new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 })
            );
            bottomShadow.position.set(0, -halfH / 2, 0.04);

            const lugGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.12, 12);
            lugGeo.rotateZ(Math.PI / 2);
            const lugMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85, roughness: 0.25 });
            const leftLug = new THREE.Mesh(lugGeo, lugMat);
            leftLug.position.set(-cardW / 2 - 0.02, 0, 0.1);
            const rightLug = new THREE.Mesh(lugGeo, lugMat);
            rightLug.position.set(cardW / 2 + 0.02, 0, 0.1);

            const flapPivot = new THREE.Group();
            flapPivot.position.set(0, 0, 0.1);

            const frontGeo = new THREE.PlaneGeometry(cardW, halfH);
            frontGeo.translate(0, halfH / 2, 0.02);
            const flapFront = new THREE.Mesh(frontGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));

            const backGeo = new THREE.PlaneGeometry(cardW, halfH);
            backGeo.rotateY(Math.PI);
            backGeo.translate(0, halfH / 2, -0.02);
            const flapBack = new THREE.Mesh(backGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));

            const edgeGeo = new THREE.BoxGeometry(cardW, halfH, 0.035);
            edgeGeo.translate(0, halfH / 2, 0);
            const flapEdge = new THREE.Mesh(edgeGeo, new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 }));

            flapPivot.add(flapFront, flapBack, flapEdge);
            group.add(topStatic, bottomStatic, bottomShadow, leftLug, rightLug, flapPivot);

            group.userData = {
                currentValue: null,
                timeline: null,
                topStatic,
                bottomStatic,
                bottomShadow,
                flapPivot,
                flapFront,
                flapBack
            };
            return group;
        }

        function updateCard(key, nextDigit) {
            const unit = flipUnits[key];
            if (!unit) return;
            const data = unit.userData;

            if (data.currentValue === null) {
                data.currentValue = nextDigit;
                const tex = getHalfTextures(nextDigit);
                data.topStatic.material.map = tex.top;
                data.bottomStatic.material.map = tex.bottom;
                data.flapFront.material.map = tex.top;
                data.flapBack.material.map = tex.bottomFlipped;
                data.topStatic.material.needsUpdate = true;
                data.bottomStatic.material.needsUpdate = true;
                data.flapFront.material.needsUpdate = true;
                data.flapBack.material.needsUpdate = true;
                return;
            }

            if (data.currentValue === nextDigit) return;

            const prevDigit = data.currentValue;
            data.currentValue = nextDigit;

            if (data.timeline) data.timeline.kill();

            const prevTex = getHalfTextures(prevDigit);
            const nextTex = getHalfTextures(nextDigit);

            data.topStatic.material.map = nextTex.top;
            data.bottomStatic.material.map = prevTex.bottom;
            data.flapFront.material.map = prevTex.top;
            data.flapBack.material.map = nextTex.bottomFlipped;

            data.topStatic.material.needsUpdate = true;
            data.bottomStatic.material.needsUpdate = true;
            data.flapFront.material.needsUpdate = true;
            data.flapBack.material.needsUpdate = true;

            data.flapPivot.rotation.x = 0;
            data.flapFront.material.color.setScalar(1.0);
            data.flapBack.material.color.setScalar(0.5);
            data.topStatic.material.color.setScalar(0.55);
            data.bottomShadow.material.opacity = 0;

            playFlipSound();

            const tl = gsap.timeline({
                onUpdate: () => {
                    const angle = data.flapPivot.rotation.x;
                    const halfPi = Math.PI / 2;
                    if (angle <= halfPi) {
                        const p = angle / halfPi;
                        data.flapFront.material.color.setScalar(1.0 - 0.45 * p);
                        data.topStatic.material.color.setScalar(0.55 + 0.45 * p);
                        data.bottomShadow.material.opacity = 0.25 * p;
                    } else {
                        const p = Math.min(1, (angle - halfPi) / halfPi);
                        data.flapBack.material.color.setScalar(0.5 + 0.5 * p);
                        data.topStatic.material.color.setScalar(1.0);
                        data.bottomShadow.material.opacity = 0.25 + 0.45 * p;
                    }
                },
                onComplete: () => {
                    data.bottomStatic.material.map = nextTex.bottom;
                    data.flapFront.material.map = nextTex.top;
                    data.bottomStatic.material.needsUpdate = true;
                    data.flapFront.material.needsUpdate = true;

                    data.flapPivot.rotation.x = 0;
                    data.flapFront.material.color.setScalar(1.0);
                    data.flapBack.material.color.setScalar(1.0);
                    data.topStatic.material.color.setScalar(1.0);
                    data.bottomShadow.material.opacity = 0;
                    data.timeline = null;
                }
            });

            tl.to(data.flapPivot.rotation, { x: Math.PI / 2, duration: 0.2, ease: 'power2.in' })
              .to(data.flapPivot.rotation, { x: Math.PI, duration: 0.24, ease: 'back.out(1.6)' });

            data.timeline = tl;
        }

        function refreshAllCardTextures() {
            Object.keys(flipUnits).forEach(key => {
                const data = flipUnits[key].userData;
                if (data.currentValue !== null) {
                    const tex = getHalfTextures(data.currentValue);
                    data.topStatic.material.map = tex.top;
                    data.bottomStatic.material.map = tex.bottom;
                    data.flapFront.material.map = tex.top;
                    data.flapBack.material.map = tex.bottomFlipped;
                    data.topStatic.material.needsUpdate = true;
                    data.bottomStatic.material.needsUpdate = true;
                    data.flapFront.material.needsUpdate = true;
                    data.flapBack.material.needsUpdate = true;
                }
            });
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            updateCard('h1', h[0]);
            updateCard('h2', h[1]);
            updateCard('m1', m[0]);
            updateCard('m2', m[1]);
            updateCard('s1', s[0]);
            updateCard('s2', s[1]);

            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('hud-date').textContent = `${now.getFullYear()}/${month}/${day} (${weekdays[now.getDay()]})`;
            document.getElementById('hud-time').textContent = `${h}:${m}:${s}`;
        }

            const pedInfo = buildPedestalWithWindowClock(built.roofOverhangFrontZ, built.backEdgeZ);

            ornamentGroup.add(pedestalGroup);

            stationGroup.position.set(0, pedInfo.topSurfaceY, 0);
            ornamentGroup.add(stationGroup);

            // 基座玻璃櫥窗內部暖白照明燈
            showcaseLight = new THREE.PointLight('#ffdfa0', 2.2, 16);
            showcaseLight.position.set(0, pedInfo.wallY + 1.4, pedInfo.frontZ - 1.2);
            ornamentGroup.add(showcaseLight);

            setupUIEvents();
            window.addEventListener('resize', onWindowResize);
        }

        function setLightingMode(mode) {
            const body = document.body;
            const badge = document.getElementById('lighting-badge');

            if (mode === 'day') {
                body.classList.remove('dark-mode');
                scene.background.set('#dfe4ea');
                scene.fog.color.set('#dfe4ea');
                dirLight.color.set('#fff8eb');
                dirLight.intensity = 1.65;
                dirLight.position.set(-22, 38, 28);
                hemiLight.intensity = 0.65;
                ambientLight.intensity = 0.55;
                showcaseLight.intensity = 2.2;
                renderer.toneMappingExposure = 1.05;

                windowMaterials.forEach(m => m.emissiveIntensity = 0.0);
                signMeshes.forEach(m => m.emissiveIntensity = 0.0);
                porticoLights.forEach(l => l.intensity = 0);

                badge.textContent = '日間陽光';
                badge.className = 'text-[11px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-medium';
            } else if (mode === 'sunset') {
                body.classList.remove('dark-mode');
                scene.background.set('#f3cbb2');
                scene.fog.color.set('#f3cbb2');
                dirLight.color.set('#ff8c42');
                dirLight.intensity = 2.0;
                dirLight.position.set(-34, 16, 22);
                hemiLight.color.set('#ffd2a6');
                hemiLight.intensity = 0.6;
                ambientLight.intensity = 0.45;
                showcaseLight.intensity = 3.2;
                renderer.toneMappingExposure = 1.02;

                windowMaterials.forEach(m => m.emissiveIntensity = 0.25);
                signMeshes.forEach(m => m.emissiveIntensity = 0.35);
                porticoLights.forEach(l => l.intensity = 1.5);

                badge.textContent = '黃昏暖陽';
                badge.className = 'text-[11px] px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 font-medium';
            } else if (mode === 'night') {
                body.classList.add('dark-mode');
                scene.background.set('#0f172a');
                scene.fog.color.set('#0f172a');
                dirLight.color.set('#6488ea');
                dirLight.intensity = 0.45;
                dirLight.position.set(18, 28, -20);
                hemiLight.color.set('#1e293b');
                hemiLight.intensity = 0.35;
                ambientLight.intensity = 0.25;
                showcaseLight.intensity = 4.5;
                renderer.toneMappingExposure = 1.15;

                windowMaterials.forEach(m => m.emissiveIntensity = 1.45);
                signMeshes.forEach(m => m.emissiveIntensity = 1.35);
                porticoLights.forEach(l => l.intensity = 4.5);

                badge.textContent = '夜間點燈';
                badge.className = 'text-[11px] px-2 py-0.5 rounded-full bg-indigo-900 text-indigo-200 font-medium';
            }
        }

        function setCameraPreset(preset) {
            if (preset === 'iso') {
                targetCamPos = new THREE.Vector3(-28, 19, 36);
                targetLookAt = new THREE.Vector3(0, 8.5, 2.0);
            } else if (preset === 'front') {
                targetCamPos = new THREE.Vector3(0, 10.5, 42);
                targetLookAt = new THREE.Vector3(0, 8.2, 4.0);
            } else if (preset === 'clock') {
                targetCamPos = new THREE.Vector3(0, 4.2, 27);
                targetLookAt = new THREE.Vector3(0, 3.6, 12.6);
            }
        }

        function exportToGLB() {
            showToast('正在產生 Kaohsiung_Station_Pedestal_Clock.glb 模型檔...');
            const exporter = new GLTFExporter();
            exporter.parse(
                ornamentGroup,
                function (result) {
                    const blob = new Blob([result], { type: 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.style.display = 'none';
                    link.href = url;
                    link.download = 'Kaohsiung_Station_Pedestal_Clock.glb';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showToast('✅ 已成功匯出 Kaohsiung_Station_Pedestal_Clock.glb！');
                },
                function (error) {
                    console.error('GLTFExporter Error:', error);
                    showToast('❌ 模型匯出失敗，請稍後再試。', true);
                },
                { binary: true }
            );
        }

        function setupUIEvents() {
            const toggleBtn = document.getElementById('toggle-panel-btn');
            const panel = document.getElementById('control-panel');
            const toggleText = document.getElementById('toggle-panel-text');
            let isPanelOpen = true;

            toggleBtn.addEventListener('click', () => {
                isPanelOpen = !isPanelOpen;
                if (isPanelOpen) {
                    panel.classList.remove('hidden');
                    toggleText.textContent = '隱藏控制項';
                } else {
                    panel.classList.add('hidden');
                    toggleText.textContent = '顯示控制項';
                }
            });

            document.querySelectorAll('.light-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.light-btn').forEach(b => b.classList.remove('btn-active'));
                    btn.classList.add('btn-active');
                    setLightingMode(btn.dataset.light);
                });
            });

            document.querySelectorAll('.cam-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('btn-active'));
                    btn.classList.add('btn-active');
                    setCameraPreset(btn.dataset.cam);
                });
            });

            const rotateBtn = document.getElementById('auto-rotate-btn');
            const rotateLabel = document.getElementById('rotate-label');
            rotateBtn.addEventListener('click', () => {
                isAutoRotating = !isAutoRotating;
                controls.autoRotate = isAutoRotating;
                controls.autoRotateSpeed = 1.2;
                rotateLabel.textContent = isAutoRotating ? '自動旋轉：開' : '自動旋轉：關';
                rotateBtn.classList.toggle('btn-active', isAutoRotating);
            });

            document.getElementById('text-color-picker').addEventListener('input', (e) => {
                customTextColor = e.target.value;
                refreshAllCardTextures();
            });

            document.getElementById('bg-color-picker').addEventListener('input', (e) => {
                customCardBgColor = e.target.value;
                refreshAllCardTextures();
            });

            const soundBtn = document.getElementById('sound-toggle-btn');
            soundBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundBtn.textContent = soundEnabled ? '🔊 音效: 開' : '🔇 音效: 關';
            });

            document.getElementById('export-glb-btn').addEventListener('click', exportToGLB);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (targetCamPos && targetLookAt) {
                camera.position.lerp(targetCamPos, 0.07);
                controls.target.lerp(targetLookAt, 0.07);
                if (camera.position.distanceTo(targetCamPos) < 0.08) {
                    targetCamPos = null;
                    targetLookAt = null;
                }
            }

            controls.update();
            updateClock();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            initScene();
            animate();
        };
    </script>
</body>
</html>
